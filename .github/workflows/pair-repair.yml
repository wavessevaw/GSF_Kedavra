name: Pair repair comparison
on:
  push:
    branches: [fix/kedavra-pair-repair-visibility]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/checkout@v4
        with:
          ref: 5f22938b55f9853f764e927c847d9c1a8d9a8c04
          path: baseline
      - name: Install Vulkan test tools
        run: sudo apt-get update && sudo apt-get install -y build-essential libvulkan-dev mesa-vulkan-drivers glslang-tools spirv-tools vulkan-tools
      - name: Build both versions
        run: |
          make -C baseline/kedavra -j2 all
          make -C candidate/kedavra -j2 all
          cp candidate/kedavra/tools/test_pair_repair.c baseline/kedavra/tools/
          for version in baseline candidate; do
            cc -O2 -g -std=c11 -I"$version/kedavra/engine" "$version/kedavra/tools/test_pair_repair.c" "$version/kedavra/engine/kfg_vk.c" -lvulkan -lm -o "$version/kedavra/build/test_pair_repair"
            for shader in "$version"/kedavra/build/*.spv; do spirv-val --target-env vulkan1.1 "$shader"; done
          done
      - name: Execute regression and image comparison
        run: |
          export VK_ICD_FILENAMES=$(find /usr/share/vulkan/icd.d -name '*lvp*json' | head -1)
          export LP_NUM_THREADS=2
          mkdir -p q1-results
          vulkaninfo --summary > q1-results/device.txt
          baseline/kedavra/build/test_pair_repair baseline/kedavra/build legacy > q1-results/contract-baseline.log 2>&1
          candidate/kedavra/build/test_pair_repair candidate/kedavra/build fixed > q1-results/contract-candidate.log 2>&1
          if baseline/kedavra/build/test_pair_repair baseline/kedavra/build fixed > q1-results/contract-reproduction.log 2>&1; then
            echo 'Baseline unexpectedly satisfies fixed contract'; exit 1
          fi
          python3 candidate/kedavra/tools/compare_pair_repair.py "$GITHUB_WORKSPACE" | tee q1-results/comparison.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pair-repair-evidence
          path: q1-results/
          retention-days: 14
