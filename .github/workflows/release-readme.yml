name: Update English release README
on:
  push:
    branches: ['docs/release-notes-en']
    paths: ['docs/releases/v1.5.0.md', '.github/workflows/release-readme.yml']
permissions:
  contents: write
jobs:
  update-readme:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Update existing release text and README only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view v1.5.0
          cp 'docs/releases/v1.5.0.md' README-1.5.0.md
          gh release edit v1.5.0 --notes-file 'docs/releases/v1.5.0.md'
          gh release upload v1.5.0 README-1.5.0.md --clobber
