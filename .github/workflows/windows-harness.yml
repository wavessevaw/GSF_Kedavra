name: Build standalone Windows Vulkan harness
on:
  push:
    branches: [experiment/kedavra-edge-motion]
permissions:
  contents: read
jobs:
  cross-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/checkout@v4
        with:
          ref: 5f22938b55f9853f764e927c847d9c1a8d9a8c04
          path: baseline
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 libvulkan-dev glslang-tools
      - name: Cross-compile the existing test harness
        run: |
          mkdir -p headers out/baseline out/candidate
          cp -r /usr/include/vulkan headers/
          if [ -d /usr/include/vk_video ]; then cp -r /usr/include/vk_video headers/; fi
          printf 'LIBRARY vulkan-1.dll\nEXPORTS\n' > vulkan.def
          grep -ohE '\bvk[A-Z][A-Za-z0-9_]+' candidate/kedavra/engine/kfg_vk.c | sort -u >> vulkan.def
          x86_64-w64-mingw32-dlltool -d vulkan.def -l libvulkan-1.a
          for version in baseline candidate; do
            x86_64-w64-mingw32-gcc -O2 -std=c11 -Iheaders -I"$version/kedavra/engine" \
              "$version/kedavra/engine/kfg_vktest.c" "$version/kedavra/engine/kfg_vk.c" \
              -L. -lvulkan-1 -lm -o "out/$version/kfg_vktest.exe"
            for shader in "$version"/kedavra/shaders/*.comp; do
              glslangValidator -V --target-env vulkan1.1 -I"$version/kedavra/shaders" \
                -o "out/$version/$(basename "${shader%.comp}").spv" "$shader"
            done
          done
          x86_64-w64-mingw32-gcc -O2 -std=c11 -Iheaders -Icandidate/kedavra/engine \
            candidate/kedavra/tools/test_edge_choice.c candidate/kedavra/engine/kfg_vk.c \
            -L. -lvulkan-1 -lm -o out/candidate/test_edge_choice.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows-vulkan-harness
          path: out/
          retention-days: 14

