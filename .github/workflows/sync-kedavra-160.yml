name: Apply concise Kedavra 1.6.0 release notes
on:
  push:
    branches: [main]
    paths: ['.github/workflows/sync-kedavra-160.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update published release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release edit v1.6.0 --notes-file RELEASE_DESCRIPTION_V1_6_0.md
          gh release view v1.6.0 --json body --jq .body | grep -F 'Single-pass processing'
