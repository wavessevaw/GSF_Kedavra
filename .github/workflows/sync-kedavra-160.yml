name: Sync Kedavra 1.6.0 release description (one time)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-kedavra-160.yml'

permissions:
  contents: write

jobs:
  update-release-notes:
    if: github.repository == 'wavessevaw/GSF_Kedavra'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply concise release notes to published v1.6.0
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test -s RELEASE_DESCRIPTION_V1_6_0.md
          gh release view v1.6.0 --json tagName --jq .tagName | grep -Fx 'v1.6.0'
          gh release edit v1.6.0 --notes-file RELEASE_DESCRIPTION_V1_6_0.md
          gh release view v1.6.0 --json body --jq .body | grep -F 'What' 
