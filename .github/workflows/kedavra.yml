name: KEDAVRA
# KEDAVRA frame generation: scheduler model, interpolation engine on Mesa
# lavapipe (a CPU Vulkan driver) and a build of the patched Gamescope.
# These jobs prove correctness and that the integration compiles; they are not
# Steam Deck measurements.
on:
  push:
    branches: [research/detail-reconstruction, release/1.6.0, integration/gfg-3.4.1, rework/benchmark-ui, release/1.7.0, test/90hz-response-2, test/courtyard-1, test/courtyard-2, test/courtyard-3, test/courtyard-4, test/focus-dark-detail, release/1.8.0, research/native-sr]
    paths: ['kedavra/**', '.github/workflows/kedavra.yml']
  pull_request:
    paths: ['kedavra/**', '.github/workflows/kedavra.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  model-and-engine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Vulkan software device and shader tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers glslang-tools python3-numpy python3-pil
      - name: Verify early real frame and irregular input fallback
        run: cc -Wall -Wextra -Werror kedavra/sched/test_response90.c -o /tmp/test-response90 && /tmp/test-response90
      - name: HUD input unit test
        run: g++ -std=c++17 -pthread -Ikedavra/gamescope/src/kfg kedavra/tools/test_hud_input.cpp -o /tmp/hud-input-test && /tmp/hud-input-test
      - name: Build
        run: make -C kedavra all detail-lab
      - name: Scheduler unit tests and model stress matrix
        run: make -C kedavra test-pacing test-sched
      - name: Exercise all courtyard routes
        run: |
          mkdir -p hud-frames
          for scene in h_courtyard h_courtyard_reverse h_courtyard_reversal h_lines_slow; do
            KFG_DETAIL_SEQUENCE_OUT=hud-frames KFG_HARD_X2=1 kedavra/build/kfg_vktest --spv kedavra/build --hard --size 320x200 --scene "$scene" --json "$scene.json"
            python3 kedavra/tools/check_hud_sequence.py hud-frames "$scene" --max-error 12
            jq -e '.hard | length == 2' "$scene.json"
          done
      - name: Compare complementary phases on a continuous turn and an instantaneous reversal
        if: github.ref == 'refs/heads/test/courtyard-4' || (github.ref == 'refs/heads/test/focus-dark-detail' || github.ref == 'refs/heads/release/1.8.0')
        run: |
          git fetch --depth=1 origin a253ec0c19a5134475935c8eebc04d2230a68ac3
          mkdir /tmp/courtyard3
          git archive a253ec0c19a5134475935c8eebc04d2230a68ac3 kedavra/shaders | tar -x -C /tmp/courtyard3
          cp -r kedavra/build /tmp/baseline
          for shader in kfg_stats kfg_select kfg_warp; do
            glslangValidator -V --target-env vulkan1.1 -I/tmp/courtyard3/kedavra/shaders -o "/tmp/baseline/$shader.spv" "/tmp/courtyard3/kedavra/shaders/$shader.comp"
          done
          for control in turn snap; do
            args=()
            if [[ $control == snap ]]; then args+=(--control snap); fi
            for variant in baseline candidate; do
              spv=kedavra/build
              if [[ $variant == baseline ]]; then spv=/tmp/baseline; fi
              /usr/bin/python3 kedavra/tools/courtyard/phase_compare.py --exe kedavra/build/kfg_vktest --spv "$spv" --size 480x300 "${args[@]}" --out "$variant-$control.json"
            done
            checks=()
            if [[ $control == snap ]]; then checks+=(--snap); fi
            python3 kedavra/tools/courtyard/check_result.py "baseline-$control.json" "candidate-$control.json" "${checks[@]}"
          done
      - name: Verify dark strokes against Courtyard 4 Focus
        if: (github.ref == 'refs/heads/test/focus-dark-detail' || github.ref == 'refs/heads/release/1.8.0')
        run: |
          git fetch --depth=1 origin 8c4e86cbb94f92cf5783a5bc84d56106a1a678d0
          git show 8c4e86cbb94f92cf5783a5bc84d56106a1a678d0:kedavra/shaders/kfg_post.comp > /tmp/c4-post.comp
          cp -r kedavra/build /tmp/c4-focus
          glslangValidator -V --target-env vulkan1.1 -Ikedavra/shaders /tmp/c4-post.comp -o /tmp/c4-focus/kfg_post.spv
          /usr/bin/python3 kedavra/tools/detail/dark_strokes.py --exe kedavra/build/kfg_detailtest --base /tmp/c4-focus --candidate kedavra/build --out /tmp/strokes
      - name: Engine correctness on lavapipe
        run: |
          export VK_ICD_FILENAMES="$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)"
          make -C kedavra test-engine
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kedavra-model-engine
          path: |
            kedavra/build/scenarios.json
            kedavra/build/engine.json
      - name: Steam Deck bench bundle (engine on RADV)
        run: |
          mkdir -p deck-bench
          cp kedavra/build/kfg_vktest kedavra/build/kfg_posttest kedavra/build/kfg_detailtest kedavra/build/*.spv deck-bench/
          cp -r kedavra/build/research deck-bench/
          cp kedavra/tools/detail/bench_detail.py deck-bench/
      - uses: actions/upload-artifact@v4
        with:
          name: kedavra-deck-bench
          path: deck-bench

  decky:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Backend tests
        run: cd kedavra/decky && python3 -m unittest discover -s tests -v
      - name: Type check and package
        run: |
          cd kedavra/decky
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          sh package.sh "$PWD/build/KEDAVRA.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: kedavra-decky
          path: kedavra/decky/build/KEDAVRA.zip

  gamescope:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Toolchain and Gamescope dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git meson ninja cmake glslang vulkan-headers \
            wayland wayland-protocols libx11 libxcomposite libxdamage libxext libxfixes libxkbcommon \
            libxmu libxrender libxres libxtst libxxf86vm libxcursor libxi libdrm libinput seatd sdl2 \
            libdecor luajit libavif libcap pipewire libei hwdata lcms2 glm benchmark pixman \
            vulkan-icd-loader xcb-util-errors xcb-util-wm xorg-xwayland libdisplay-info libliftoff python patchelf
      - uses: actions/checkout@v4
      - name: Gamescope at the pinned commit
        run: |
          pin=$(sed -n 's/^GAMESCOPE_COMMIT=//p' kedavra/gamescope/apply.sh)
          git init -q /tmp/gamescope
          git -C /tmp/gamescope remote add origin https://github.com/ValveSoftware/gamescope.git
          git -C /tmp/gamescope fetch -q --depth 1 origin "$pin"
          git -C /tmp/gamescope checkout -q FETCH_HEAD
          git -C /tmp/gamescope submodule update --init --depth 1 --recursive
      - name: Apply KEDAVRA
        run: sh kedavra/gamescope/apply.sh /tmp/gamescope
      - name: Build
        run: |
          cd /tmp/gamescope
          # --prefix=/usr: display scripts from /usr/share/gamescope/scripts (Deck OLED HDR).
          meson setup build --prefix=/usr --buildtype=release -Dpipewire=enabled -Denable_openvr_support=false -Denable_tests=false
          ninja -C build
      - name: Smoke
        run: |
          /tmp/gamescope/build/src/gamescope --version || true
          nm -C /tmp/gamescope/build/src/gamescope | grep -c 'kfg::'
      - name: Bundle with its libraries
        run: |
          sh kedavra/gamescope/bundle.sh /tmp/gamescope/build gamescope-runtime "kedavra-1.9.0-sr.1-${GITHUB_SHA::7}"
          cat gamescope-runtime/LIBS
      - name: Bundled runtime resolves from its install location
        run: |
          mkdir -p /var/lib/kedavra
          cp -a gamescope-runtime /var/lib/kedavra/runtime
          R=/var/lib/kedavra/runtime
          readelf -l $R/bin/gamescope | grep 'interpreter: /var/lib/kedavra/runtime/lib/'
          $R/lib/ld-linux-x86-64.so.2 --list $R/bin/gamescope | tee /tmp/ldd.txt
          if grep -q 'not found' /tmp/ldd.txt; then exit 1; fi
          grep -c "$R/lib/" /tmp/ldd.txt
          $R/bin/gamescope --version
      - uses: actions/upload-artifact@v4
        with:
          name: gamescope-runtime
          path: gamescope-runtime

  runtime-on-older-glibc:
    # SteamOS ships an older glibc than the Arch build host. The runtime carries its own
    # glibc, so it must start on a distribution whose glibc is older than SteamOS's
    # (Debian 12: 2.36). Only the system-side libraries come from Debian here.
    needs: gamescope
    runs-on: ubuntu-24.04
    container: debian:bookworm
    steps:
      - name: System-side libraries the runtime does not bundle
        run: |
          apt-get update
          apt-get install -y --no-install-recommends binutils libvulkan1 libgbm1 libegl1 libgl1 \
            libdrm-amdgpu1 libdrm-radeon1 libudev1 libsystemd0 libasound2 libpulse0 libpipewire-0.3-0 libdbus-1-3
          ldd --version | head -1
      - uses: actions/download-artifact@v4
        with:
          name: gamescope-runtime
          path: gamescope-runtime
      - name: Runtime starts against the older system
        run: |
          R=/var/lib/kedavra/runtime
          mkdir -p /var/lib/kedavra
          cp -a gamescope-runtime $R
          chmod 755 $R/bin/* $R/lib/*
          $R/lib/ld-linux-x86-64.so.2 --list $R/bin/gamescope | tee /tmp/ldd.txt
          if grep -q 'not found' /tmp/ldd.txt; then exit 1; fi
          $R/bin/gamescope --version
          $R/bin/gamescopectl --help >/dev/null 2>&1 || true

  plugin:
    needs: [model-and-engine, gamescope, runtime-on-older-glibc, decky]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: gamescope-runtime
          path: gamescope-runtime
      - uses: actions/download-artifact@v4
        with:
          name: kedavra-deck-bench
          path: deck-bench
      - name: Full install candidate with runtime, research bench and rollback instructions
        run: |
          sh kedavra/decky/package.sh "$PWD/GSF-Kedavra-1.9.0-sr.1.zip" "$PWD/gamescope-runtime" "$PWD/deck-bench"
          sha256sum GSF-Kedavra-1.9.0-sr.1.zip > GSF-Kedavra-1.9.0-sr.1.zip.sha256
          cp README-1.8.0.md README-Detail-Candidate.md
      - uses: actions/upload-artifact@v4
        with:
          name: GSF-Kedavra-Detail-Candidate
          path: |
            GSF-Kedavra-1.9.0-sr.1.zip
            GSF-Kedavra-1.9.0-sr.1.zip.sha256
            README-Detail-Candidate.md

  detail-lab:
    if: github.ref != 'refs/heads/test/courtyard-2'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Lab dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers glslang-tools spirv-tools vulkan-validationlayers python3-numpy python3-scipy python3-pil ffmpeg
      - name: Build and validate shaders
        run: |
          make -C kedavra all detail-lab
          for f in kedavra/build/*.spv kedavra/build/research/*.spv; do
            spirv-val --target-env vulkan1.1 --scalar-block-layout "$f"
          done
      - name: Vulkan validation and reproducible comparison
        run: |
          export VK_ICD_FILENAMES="$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)"
          KFG_VALIDATION=1 kedavra/build/kfg_posttest --spv kedavra/build 2>&1 | tee validation.log
          ! grep -E 'Validation Error|VUID-' validation.log
          python3 kedavra/tools/detail/fetch_references.py /tmp/detail-references
          mkdir -p /tmp/detail-fg
          KFG_HARD_OUT=/tmp/detail-fg KFG_HARD_X2=1 KFG_DETAIL_SEQUENCE_OUT=/tmp/detail-fg kedavra/build/kfg_vktest --spv kedavra/build --size 320x200 --hard --json hard-engine.json
          python3 kedavra/tools/detail/compare.py --exe kedavra/build/kfg_detailtest --spv kedavra/build/research --references /tmp/detail-references --fg /tmp/detail-fg --out detail-results --bench 100 --detail-max-excursion 7 --detail-max-below 14
      - name: Compare frozen Detail 2 and practical Edge configurations
        run: |
          export VK_ICD_FILENAMES="$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)"
          # Retrieve the exact published candidate shader, never main or a moving branch.
          git fetch --depth 1 origin 3553eb04dc8b29e6beda5b5c88d9970c412d128a
          git show 3553eb04dc8b29e6beda5b5c88d9970c412d128a:kedavra/shaders/kfg_post.comp > /tmp/old-post.comp
          mkdir -p /tmp/old-spv /tmp/old-research
          cp kedavra/build/*.spv /tmp/old-spv/
          cp kedavra/build/research/*.spv /tmp/old-research/
          glslangValidator -V --target-env vulkan1.1 -Ikedavra/shaders /tmp/old-post.comp -o /tmp/old-spv/kfg_post.spv
          glslangValidator -V --target-env vulkan1.1 -DKFG_POST_RESEARCH=1 -Ikedavra/shaders /tmp/old-post.comp -o /tmp/old-research/kfg_post.spv
          python3 kedavra/tools/detail/compare.py --exe kedavra/build/kfg_detailtest --spv /tmp/old-research --references /tmp/detail-references --fg /tmp/detail-fg --out /tmp/old-results
          git fetch --depth 1 origin 32579d817affb9ebb8085eebe32371c55e915c28
          git show 32579d817affb9ebb8085eebe32371c55e915c28:kedavra/shaders/kfg_post.comp > /tmp/detail3.comp
          mkdir -p /tmp/detail3-spv
          cp kedavra/build/*.spv /tmp/detail3-spv/
          glslangValidator -V --target-env vulkan1.1 -Ikedavra/shaders /tmp/detail3.comp -o /tmp/detail3-spv/kfg_post.spv
          python3 kedavra/tools/detail/compare_edge.py --baseline /tmp/old-results --exe kedavra/build/kfg_posttest --spv /tmp/detail3-spv --out /tmp/edge-detail3
          python3 kedavra/tools/detail/edge_variants.py --shader kedavra/shaders/kfg_post.comp --spv kedavra/build --out /tmp/edge-variants
          python3 kedavra/tools/detail/compare_edge.py --baseline /tmp/old-results --exe kedavra/build/kfg_posttest --spv kedavra/build --out /tmp/edge-fixed
          for variant in conservative balanced strong; do
            spirv-val --target-env vulkan1.1 --scalar-block-layout /tmp/edge-variants/$variant/kfg_post.spv
            python3 kedavra/tools/detail/compare_edge.py --baseline /tmp/old-results --exe kedavra/build/kfg_posttest --spv /tmp/edge-variants/$variant --out /tmp/edge-$variant
          done
          python3 kedavra/tools/detail/probe_profiles.py --exe kedavra/build/kfg_posttest --spv kedavra/build --variant detail3=/tmp/detail3-spv --variant old=/tmp/old-spv --variant fixed=kedavra/build --variant conservative=/tmp/edge-variants/conservative --variant balanced=/tmp/edge-variants/balanced --variant strong=/tmp/edge-variants/strong --out /tmp/edge-controls
          python3 kedavra/tools/detail/edge_evidence.py --baseline /tmp/old-results --fixed /tmp/edge-fixed --experiment detail3=/tmp/edge-detail3 --experiment conservative=/tmp/edge-conservative --experiment balanced=/tmp/edge-balanced --experiment strong=/tmp/edge-strong --controls /tmp/edge-controls --out edge-evidence
      - uses: actions/upload-artifact@v4
        with:
          name: edge-evidence
          path: |
            edge-evidence/Edge-Evidence.zip
            edge-evidence/Edge-Evidence.zip.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detail-comparison-software-vulkan
          path: |
            detail-results
            validation.log
            hard-engine.json

  gfg-response-test:
    if: github.ref == 'refs/heads/test/courtyard-3'
    needs: [model-and-engine, gamescope, runtime-on-older-glibc]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: wavessevaw/GFG-Extreme
          ref: 10b0e63f6126e47c98bfa813c456f1f4019a5fc3
      - uses: actions/download-artifact@v4
        with:
          name: gamescope-runtime
          path: runtime-build
      - uses: actions/download-artifact@v4
        with:
          name: kedavra-deck-bench
          path: bench-build
      - name: Package and verify the complete GFG test plugin
        run: |
          python3 -m unittest discover -s tests
          python3 -m sandbox.run
          test "$(cat runtime-build/VERSION)" = "kedavra-1.7.0-${GITHUB_SHA::7}"
          bash scripts/build_release.sh 3.5.0-courtyard.3 "$PWD/runtime-build" "$PWD/out" "$PWD/bench-build"
          cd out
          sha256sum -c SHA256SUMS.txt
          unzip -tq *.zip
          cmp <(unzip -p *.zip GFG-Extreme/runtime/bin/gamescope) ../runtime-build/bin/gamescope
      - uses: actions/upload-artifact@v4
        with:
          name: GFG-Extreme-Courtyard-3
          path: out/

  publish-180:
    if: github.ref == 'refs/heads/release/1.8.0'
    needs: [plugin, detail-lab]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: GSF-Kedavra-Detail-Candidate
          path: out
      - name: Verify and publish the standalone release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          zip=GSF-Kedavra-1.9.0-sr.1.zip
          sha256sum -c "$zip.sha256"
          unzip -tq "$zip"
          test "$(unzip -p "$zip" KEDAVRA/package.json | jq -r .version)" = 1.8.0
          test "$(unzip -p "$zip" KEDAVRA/runtime/VERSION)" = "kedavra-1.9.0-sr.1-${GITHUB_SHA::7}"
          unzip -p "$zip" KEDAVRA/dist/index.js > "$RUNNER_TEMP/plugin.js"
          grep -Fq '1.8.0' "$RUNNER_TEMP/plugin.js"
          gh release create v1.8.0 "$zip" "$zip.sha256" ../README-1.8.0.md --target "$GITHUB_SHA" --title 'GSF Kedavra 1.8.0' --notes-file ../README-1.8.0.md --latest
