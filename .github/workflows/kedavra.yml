name: KEDAVRA
# KEDAVRA frame generation: scheduler model, interpolation engine on Mesa
# lavapipe (a CPU Vulkan driver) and a build of the patched Gamescope.
# These jobs prove correctness and that the integration compiles; they are not
# Steam Deck measurements.
on:
  push:
    branches: [main, release/silk-1.5.0]
    tags: ['v*']
    paths: ['kedavra/**', '.github/workflows/kedavra.yml']
  pull_request:
    paths: ['kedavra/**', '.github/workflows/kedavra.yml']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Publish the plugin as release vX.Y.Z (the tag is created on this commit if missing; main only); empty = build only'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  model-and-engine:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Vulkan software device and shader tools
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev mesa-vulkan-drivers glslang-tools
      - name: Build
        run: make -C kedavra all
      - name: Scheduler unit tests and model stress matrix
        run: make -C kedavra test-pacing test-sched
      - name: Engine correctness on lavapipe
        run: |
          export VK_ICD_FILENAMES="$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1)"
          make -C kedavra test-engine
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kedavra-model-engine
          path: |
            kedavra/build/scenarios.json
            kedavra/build/engine.json
      - name: Steam Deck bench bundle (engine on RADV)
        run: |
          mkdir -p deck-bench
          cp kedavra/build/kfg_vktest kedavra/build/kfg_posttest kedavra/build/*.spv deck-bench/
      - uses: actions/upload-artifact@v4
        with:
          name: kedavra-deck-bench
          path: deck-bench

  decky:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Backend tests
        run: cd kedavra/decky && python3 -m unittest discover -s tests -v
      - name: Type check and package
        run: |
          cd kedavra/decky
          npm ci --no-audit --no-fund
          npx tsc --noEmit
          sh package.sh "$PWD/build/KEDAVRA.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: kedavra-decky
          path: kedavra/decky/build/KEDAVRA.zip

  gamescope:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    steps:
      - name: Toolchain and Gamescope dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git meson ninja cmake glslang vulkan-headers \
            wayland wayland-protocols libx11 libxcomposite libxdamage libxext libxfixes libxkbcommon \
            libxmu libxrender libxres libxtst libxxf86vm libxcursor libxi libdrm libinput seatd sdl2 \
            libdecor luajit libavif libcap pipewire libei hwdata lcms2 glm benchmark pixman \
            vulkan-icd-loader xcb-util-errors xcb-util-wm xorg-xwayland libdisplay-info libliftoff python patchelf
      - uses: actions/checkout@v4
      - name: Gamescope at the pinned commit
        run: |
          pin=$(sed -n 's/^GAMESCOPE_COMMIT=//p' kedavra/gamescope/apply.sh)
          git init -q /tmp/gamescope
          git -C /tmp/gamescope remote add origin https://github.com/ValveSoftware/gamescope.git
          git -C /tmp/gamescope fetch -q --depth 1 origin "$pin"
          git -C /tmp/gamescope checkout -q FETCH_HEAD
          git -C /tmp/gamescope submodule update --init --depth 1 --recursive
      - name: Apply KEDAVRA
        run: sh kedavra/gamescope/apply.sh /tmp/gamescope
      - name: Build
        run: |
          cd /tmp/gamescope
          # --prefix=/usr: display scripts from /usr/share/gamescope/scripts (Deck OLED HDR).
          meson setup build --prefix=/usr --buildtype=release -Dpipewire=enabled -Denable_openvr_support=false -Denable_tests=false
          ninja -C build
      - name: Smoke
        run: |
          /tmp/gamescope/build/src/gamescope --version || true
          nm -C /tmp/gamescope/build/src/gamescope | grep -c 'kfg::'
      - name: Bundle with its libraries
        run: |
          sh kedavra/gamescope/bundle.sh /tmp/gamescope/build gamescope-runtime "kedavra-${GITHUB_SHA::7}"
          cat gamescope-runtime/LIBS
      - name: Bundled runtime resolves from its install location
        run: |
          mkdir -p /var/lib/kedavra
          cp -a gamescope-runtime /var/lib/kedavra/runtime
          R=/var/lib/kedavra/runtime
          readelf -l $R/bin/gamescope | grep 'interpreter: /var/lib/kedavra/runtime/lib/'
          $R/lib/ld-linux-x86-64.so.2 --list $R/bin/gamescope | tee /tmp/ldd.txt
          if grep -q 'not found' /tmp/ldd.txt; then exit 1; fi
          grep -c "$R/lib/" /tmp/ldd.txt
          $R/bin/gamescope --version
      - uses: actions/upload-artifact@v4
        with:
          name: gamescope-runtime
          path: gamescope-runtime

  runtime-on-older-glibc:
    # SteamOS ships an older glibc than the Arch build host. The runtime carries its own
    # glibc, so it must start on a distribution whose glibc is older than SteamOS's
    # (Debian 12: 2.36). Only the system-side libraries come from Debian here.
    needs: gamescope
    runs-on: ubuntu-24.04
    container: debian:bookworm
    steps:
      - name: System-side libraries the runtime does not bundle
        run: |
          apt-get update
          apt-get install -y --no-install-recommends binutils libvulkan1 libgbm1 libegl1 libgl1 \
            libdrm-amdgpu1 libdrm-radeon1 libudev1 libsystemd0 libasound2 libpulse0 libpipewire-0.3-0 libdbus-1-3
          ldd --version | head -1
      - uses: actions/download-artifact@v4
        with:
          name: gamescope-runtime
          path: gamescope-runtime
      - name: Runtime starts against the older system
        run: |
          R=/var/lib/kedavra/runtime
          mkdir -p /var/lib/kedavra
          cp -a gamescope-runtime $R
          chmod 755 $R/bin/* $R/lib/*
          $R/lib/ld-linux-x86-64.so.2 --list $R/bin/gamescope | tee /tmp/ldd.txt
          if grep -q 'not found' /tmp/ldd.txt; then exit 1; fi
          $R/bin/gamescope --version
          $R/bin/gamescopectl --help >/dev/null 2>&1 || true

  plugin:
    needs: [model-and-engine, gamescope, runtime-on-older-glibc]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/download-artifact@v4
        with:
          name: gamescope-runtime
          path: gamescope-runtime
      - uses: actions/download-artifact@v4
        with:
          name: kedavra-deck-bench
          path: deck-bench
      - name: Plugin zip with runtime and bench
        run: sh kedavra/decky/package.sh "$PWD/KEDAVRA.zip" "$PWD/gamescope-runtime" "$PWD/deck-bench"
      - uses: actions/upload-artifact@v4
        with:
          name: KEDAVRA-plugin
          path: KEDAVRA.zip

  # A pushed version tag (v1.0.0) publishes the plugin zip built above as a GitHub release,
  # with the notes in docs/releases/<tag>.md. A release already made on github.com with a new
  # tag gets the zip and the notes added. Run by hand on main with a tag, it publishes that
  # release, creating the tag on the commit it ran on when the tag does not exist yet.
  release:
    if: github.ref == 'refs/heads/release/silk-1.5.0' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'v') && github.ref == 'refs/heads/main')
    needs: plugin
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: KEDAVRA-plugin
          path: out
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref == 'refs/heads/release/silk-1.5.0' && 'v1.5.0' || (github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name) }}
        run: |
          v=${TAG#v}
          cp out/KEDAVRA.zip "GSF-Kedavra-$v.zip"
          cp "docs/releases/$TAG.md" "README-$v.md"
          sha256sum "GSF-Kedavra-$v.zip" > "GSF-Kedavra-$v.zip.sha256"
          if gh release view "$TAG" >/dev/null 2>&1; then
            # The release was created on github.com together with the tag: fill it in.
            gh release upload "$TAG" "GSF-Kedavra-$v.zip" "GSF-Kedavra-$v.zip.sha256" "README-$v.md" --clobber
            gh release edit "$TAG" --title "GSF $v Kedavra" --notes-file "docs/releases/$TAG.md"
          else
            gh release create "$TAG" "GSF-Kedavra-$v.zip" "GSF-Kedavra-$v.zip.sha256" "README-$v.md" \
              --title "GSF $v Kedavra" --notes-file "docs/releases/$TAG.md" --target "$GITHUB_SHA"
          fi
