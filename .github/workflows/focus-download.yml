name: Distribute Focus test candidate
on:
  push:
    branches: [distribution/focus-detail4]
    paths: [.github/workflows/focus-download.yml]
permissions:
  contents: write
  actions: read
jobs:
  publish-candidate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify successful source build and download its complete artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: wavessevaw/GSF_Kedavra
        run: |
          gh run watch 42761863475 --exit-status --interval 30
          test "$(gh api repos/$GH_REPO/actions/runs/42761863475 --jq .conclusion)" = success
          test "$(gh api repos/$GH_REPO/actions/runs/42761863475 --jq .head_sha)" = b381816fc17b64846fdc74ac62cfb4bebfe00330
          gh run download 42761863475 --name GSF-Kedavra-Detail-Candidate --dir out
          gh run download 42761863475 --name edge-evidence --dir evidence
          (cd evidence && sha256sum -c Edge-Evidence.zip.sha256 && unzip -t Edge-Evidence.zip | tail -1)
          cd out
          sha256sum -c GSF-Kedavra-1.5.1-detail.4.zip.sha256
          unzip -t GSF-Kedavra-1.5.1-detail.4.zip | tail -1
          python3 - <<'PY'
          import json, zipfile
          with zipfile.ZipFile("GSF-Kedavra-1.5.1-detail.4.zip") as z:
              assert json.loads(z.read("KEDAVRA/package.json"))["version"] == "1.5.1-detail.4"
              assert "b381816" in z.read("KEDAVRA/runtime/VERSION").decode()
              ui = z.read("KEDAVRA/dist/index.js").decode()
              assert "Kedavra Focus" in ui and "Processing strength" in ui
              assert "Game passes recorded this session" in ui
              assert "KEDAVRA/bench/kfg_posttest" in z.namelist()
              assert "KEDAVRA/runtime/bin/gamescope" in z.namelist()
              report = z.read("KEDAVRA/docs/detail/BALANCED.md").decode()
              assert "balanced response" in report
          with zipfile.ZipFile("../evidence/Edge-Evidence.zip") as z:
              profiles = json.loads(z.read("controls/profiles.json"))["cases"]
              assert profiles["ringing_proxy"]["fixed_0.5"]["halo_area_code_pixels"] <= profiles["ringing_proxy"]["cas"]["halo_area_code_pixels"] + 2
              assert profiles["soft"]["fixed_0.5"]["width20_80_px"] < profiles["soft"]["input"]["width20_80_px"]
              assert len({n.split("/")[1] for n in z.namelist() if n.startswith("frames/")}) >= 170
          PY
      - name: Publish as prerelease only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: wavessevaw/GSF_Kedavra
        run: |
          cp docs/detail/Software-Dispatch.json out/Software-Dispatch.json
          TAG=v1.5.1-detail.4
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite its assets."
            exit 1
          fi
          gh release create "$TAG" out/GSF-Kedavra-1.5.1-detail.4.zip out/GSF-Kedavra-1.5.1-detail.4.zip.sha256 out/README-Detail-Candidate.md out/Software-Dispatch.json evidence/Edge-Evidence.zip evidence/Edge-Evidence.zip.sha256 \
            --target b381816fc17b64846fdc74ac62cfb4bebfe00330 \
            --title "Kedavra Focus — 1.5.1-detail.4 Test Candidate" \
            --notes-file docs/detail/DOWNLOAD.md --prerelease --latest=false
