name: Distribute Focus test candidate
on:
  push:
    branches: [distribution/focus-detail2]
    paths: [.github/workflows/focus-download.yml]
permissions:
  contents: write
  actions: read
jobs:
  publish-candidate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Verify successful source build and download its complete artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: wavessevaw/GSF_Kedavra
        run: |
          test "$(gh api repos/$GH_REPO/actions/runs/42704101776 --jq .conclusion)" = success
          test "$(gh api repos/$GH_REPO/actions/runs/42704101776 --jq .head_sha)" = 3553eb04dc8b29e6beda5b5c88d9970c412d128a
          gh run download 42704101776 --name GSF-Kedavra-Detail-Candidate --dir out
          cd out
          sha256sum -c GSF-Kedavra-1.5.1-detail.2.zip.sha256
          unzip -t GSF-Kedavra-1.5.1-detail.2.zip | tail -1
          python3 - <<'PY'
          import json, zipfile
          with zipfile.ZipFile("GSF-Kedavra-1.5.1-detail.2.zip") as z:
              assert json.loads(z.read("KEDAVRA/package.json"))["version"] == "1.5.1-detail.2"
              assert "3553eb0" in z.read("KEDAVRA/runtime/VERSION").decode()
              ui = z.read("KEDAVRA/dist/index.js").decode()
              assert "Kedavra Focus" in ui and "Processing strength" in ui
          PY
      - name: Publish as prerelease only
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: wavessevaw/GSF_Kedavra
        run: |
          TAG=v1.5.1-detail.2
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite its assets."
            exit 1
          fi
          gh release create "$TAG" out/GSF-Kedavra-1.5.1-detail.2.zip out/GSF-Kedavra-1.5.1-detail.2.zip.sha256 out/README-Detail-Candidate.md \
            --target 3553eb04dc8b29e6beda5b5c88d9970c412d128a \
            --title "Kedavra Focus — 1.5.1-detail.2 Test Candidate" \
            --notes-file docs/detail/DOWNLOAD.md --prerelease --latest=false
