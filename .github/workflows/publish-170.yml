name: Publish verified GSF Kedavra 1.7.0
on:
  push:
    branches: [publish/1.7.0]
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: wavessevaw/GSF_Kedavra
      SOURCE: e99adf8f214889c4519b4bcc9f5c952ed4861e91
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE }}
      - name: Wait for pinned release checks
        run: |
          test "$(gh api repos/$GH_REPO/actions/runs/44330939557 --jq .head_sha)" = "$SOURCE"
          gh run watch 44330939557 --interval 30 --exit-status
      - name: Validate standalone ZIP before publishing
        run: |
          gh run download 44330939557 -n GSF-Kedavra-Detail-Candidate -D out
          (cd out && sha256sum -c GSF-Kedavra-1.7.0.zip.sha256)
          archive=out/GSF-Kedavra-1.7.0.zip
          unzip -tq "$archive"
          test "$(unzip -p "$archive" KEDAVRA/runtime/VERSION)" = "kedavra-1.7.0-${SOURCE::7}"
          test "$(unzip -p "$archive" KEDAVRA/package.json | jq -r .version)" = 1.7.0
          unzip -Z1 "$archive" | grep -Fx KEDAVRA/runtime/bin/gamescope
          unzip -Z1 "$archive" | grep -Fx KEDAVRA/bench/kfg_vktest
          cmp <(unzip -p "$archive" KEDAVRA/py_modules/kedavra_controller.py) kedavra/decky/py_modules/kedavra_controller.py
          gh release create v1.7.0 "$archive" "$archive.sha256" README-1.7.0.md --target "$SOURCE" --title 'GSF Kedavra 1.7.0' --notes-file README-1.7.0.md --latest
